<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rukhsat — Photo Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="security.js"></script>
</head>
<body>
  <div class="film-grain"></div>
  <div class="vignette"></div>

  <audio id="bg-audio" loop autoplay data-track-title="Woh Din">
    <source src="audio/woh_din.mp3" type="audio/mpeg">
  </audio>

  <header class="navbar">
    <div class="logo">IT Farewell'26</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="photo-vault.html" class="active">Photo Vault</a>
      <a href="video-vault.html">Video Vault</a>
    </nav>
    <div class="header-actions">
      <button class="music-toggle-btn" id="music-quick-btn" title="Toggle Background Music">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="music-icon paused">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="music-status-text">Play Soundtrack</span>
      </button>
    </div>
  </header>

  <section class="photo-vault-section" id="photo-vault" style="padding-top: 130px; min-height: 85vh;">
    <div class="section-header">
      <h2 class="section-title">The Photo Vault</h2>
      <p class="section-desc">Snapshots of our journey. Captured moments frozen in time.</p>
    </div>

    <div class="video-grid" id="photo-grid-container"></div>

    <!-- Cinematic Photo modal viewer -->
    <div class="cinema-modal hidden" id="photo-modal">
      <div class="cinema-backdrop"></div>
      <div class="cinema-container" style="max-width: 800px;">
        <button class="cinema-close-btn" id="photo-modal-close-btn" title="Close Photo Viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        <div class="vintage-screen-frame">
          <div class="screen-glare"></div>
          <div style="width: 100%; display: flex; justify-content: center; align-items: center; background: #111; padding: 20px;">
            <img id="photo-modal-img" src="" alt="" style="max-width: 100%; max-height: 65vh; object-fit: contain; border: 2px solid white; box-shadow: 0 0 25px rgba(0,0,0,0.85);">
          </div>
        </div>
        <div class="cinema-details">
          <span class="cinema-badge" id="photo-modal-category">Campus Life</span>
          <h3 class="cinema-title" id="photo-modal-title"></h3>
          <p class="cinema-desc" id="photo-modal-desc"></p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p class="footer-text">Rukhsat © Class of 2026. Made with ❤️, tea, and lots of memories.</p>
    <p class="footer-subtext">Designed to live forever on the web.</p>
  </footer>

  <a href="rsvp.html" class="floating-rsvp-btn" id="rsvp-float">
    <span class="rsvp-btn-text">Get your reservation<br>done soon.</span>
    <div class="rsvp-btn-seal">RSVP</div>
  </a>

  <script src="app.js"></script>
</body>
</html>
