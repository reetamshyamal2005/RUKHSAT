<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Rukhsat — Video Vault</title>
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
        <script src="security.js"></script>
    </head>
    <body>
        <div class="film-grain"></div>
        <div class="vignette"></div>

        <header class="navbar">
            <div class="logo">IT Farewell'26</div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="photo-vault.html">Photo Vault</a>
                <a href="video-vault.html" class="active"
                    >Video Vault</a
                >
            </nav>
            <div class="header-actions">
                <button
                    class="hamburger-btn"
                    id="menu-toggle"
                    aria-label="Toggle Menu"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Mobile Drawer Overlay -->
        <div class="nav-drawer" id="nav-drawer">
            <div class="drawer-header">
                <div class="logo">IT Farewell'26</div>
                <button
                    class="drawer-close-btn"
                    id="menu-close"
                    aria-label="Close Menu"
                >
                    &times;
                </button>
            </div>
            <nav class="drawer-links">
                <a href="index.html">Home</a>
                <a href="photo-vault.html">Photo Vault</a>
                <a href="video-vault.html" class="active"
                    >Video Vault</a
                >
            </nav>
        </div>

        <section
            class="video-vault-section"
            id="video-vault"
            style="padding-top: 80px"
        >
            <div class="section-header">
                <h2 class="section-title">
                    The Video Vault
                </h2>
                <p class="section-desc">
                    Tune into our moments in motion.
                    Handpicked memories from our shared
                    journey.
                </p>
            </div>

            <div class="vault-controls">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="media-search"
                        placeholder="Search the archives..."
                    />
                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="8"
                        ></circle>
                        <line
                            x1="21"
                            y1="21"
                            x2="16.65"
                            y2="16.65"
                        ></line>
                    </svg>
                </div>
            </div>

            <div
                class="video-grid"
                id="video-grid-container"
            ></div>

            <div
                class="cinema-modal hidden"
                id="video-modal"
            >
                <div class="cinema-backdrop"></div>
                <div class="cinema-container">
                    <button
                        class="cinema-close-btn"
                        id="modal-close-btn"
                        title="Close Theater Mode"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <line
                                x1="18"
                                y1="6"
                                x2="6"
                                y2="18"
                            ></line>
                            <line
                                x1="6"
                                y1="6"
                                x2="18"
                                y2="18"
                            ></line>
                        </svg>
                    </button>
                    <div class="vintage-screen-frame">
                        <div class="screen-glare"></div>
                        <div class="iframe-container">
                            <iframe
                                id="modal-iframe"
                                src=""
                                allow="autoplay"
                                allowfullscreen
                            ></iframe>
                        </div>
                    </div>
                    <div class="cinema-details">
                        <h3
                            class="cinema-title"
                            id="modal-title"
                        ></h3>
                        <p
                            class="cinema-desc"
                            id="modal-desc"
                        ></p>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p class="footer-text">
                Rukhsat © Class of 2026. Made with ❤️, tea,
                and lots of memories.
            </p>
            <p class="footer-subtext">
                Designed to live forever on the web.
            </p>
        </footer>

        <script src="videos.js"></script>
        <script src="app.js"></script>
    </body>
</html>
